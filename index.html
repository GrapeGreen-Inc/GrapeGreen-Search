<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeGreen Search</title>
    <style>
        :root {
            --bg-primary: #3b1c63;      /* Deep Grape Purple from branding */
            --bg-secondary: #2a1249;    /* Darker purple for cards/containers */
            --bg-surface: #4a247a;      /* Elevated surface */
            --accent-green: #8ce03f;    /* Lime/Leaf Green from branding */
            --accent-green-hover: #76c72e;
            --accent-purple: #9d71e8;   /* Soft grape highlight */
            --text-primary: #ffffff;
            --text-secondary: #d4c5e8;
            --border-color: rgba(157, 113, 232, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Custom Grape SVG Logo */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .grape-svg {
            width: 80px;
            height: 95px;
            margin-bottom: 12px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
        }

        .brand-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .brand-title span {
            color: var(--accent-green);
        }

        .brand-tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* Home / Search Hero Layout */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        #main-container.has-results {
            justify-content: flex-start;
            padding-top: 30px;
        }

        #main-container.has-results .grape-svg {
            width: 42px;
            height: 50px;
            margin-bottom: 4px;
        }

        #main-container.has-results .brand-title {
            font-size: 2rem;
        }

        #main-container.has-results .brand-tagline {
            display: none;
        }

        /* Huge Search Bar Area */
        .search-wrapper {
            width: 100%;
            max-width: 740px;
            margin: 28px 0 20px 0;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 14px 8px 26px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-box:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px rgba(140, 224, 63, 0.18);
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            padding: 12px 10px;
            width: 100%;
        }

        #search-input::placeholder {
            color: rgba(212, 197, 232, 0.5);
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 30px;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-search {
            background-color: var(--accent-green);
            color: #1c0c31;
        }

        .btn-search:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-ai {
            background: linear-gradient(135deg, #6d3cc4, #4c2294);
            color: var(--text-primary);
            border: 1px solid var(--accent-purple);
        }

        .btn-ai:hover {
            background: linear-gradient(135deg, #7e49db, #5b29b0);
        }

        /* Fuzzy Match Banner */
        #fuzzy-banner {
            display: none;
            width: 100%;
            background: rgba(140, 224, 63, 0.12);
            border: 1px solid rgba(140, 224, 63, 0.35);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            margin-bottom: 4px;
        }

        #fuzzy-banner strong {
            color: var(--accent-green);
        }

        /* Results Section */
        #results-area {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 60px;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        /* Section Cards */
        .section-block {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        .section-heading {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .match-tag {
            font-size: 0.72rem;
            background: rgba(157, 113, 232, 0.25);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 8px;
            text-transform: none;
            letter-spacing: 0;
        }

        /* AI Overview Box */
        .ai-overview-card {
            background: linear-gradient(145deg, #2d144d, #3a1a63);
            border: 1px solid var(--accent-green);
        }

        .ai-overview-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* Videos List (Name + URL to video) */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .video-link-card:hover {
            border-color: var(--accent-green);
            background: #432070;
            transform: translateX(4px);
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .video-name {
            font-size: 1.08rem;
            font-weight: 700;
            color: #ffffff;
        }

        .video-url-text {
            font-size: 0.85rem;
            color: var(--accent-green);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-play-pill {
            background: var(--accent-green);
            color: #1c0c31;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Images Grid (URL iframe to image) */
        .image-iframe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .image-iframe-card {
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-iframe-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-green);
        }

        .image-iframe-frame {
            width: 100%;
            height: 200px;
            border: none;
            background: #1a0b2e;
            display: block;
        }

        .image-iframe-footer {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid var(--border-color);
        }

        .image-iframe-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .image-iframe-link {
            font-size: 0.78rem;
            color: var(--accent-green);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-iframe-link:hover {
            text-decoration: underline;
        }

        /* Indexed Sites List */
        .site-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .site-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .site-item:hover {
            border-color: var(--accent-green);
            background: #432070;
            transform: translateX(4px);
        }

        .site-url {
            font-size: 0.85rem;
            color: var(--accent-green);
            margin-bottom: 4px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .popular-badge {
            background: rgba(140, 224, 63, 0.2);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .site-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .site-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .site-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--accent-purple);
        }

        .meta-pill {
            background: var(--bg-secondary);
            padding: 3px 9px;
            border-radius: 8px;
        }

        .empty-state {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.95rem;
        }

        /* =========================================
           FULLSCREEN AI MODE OVERLAY
           ========================================= */
        #ai-mode-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-secondary);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }

        #ai-mode-screen.active {
            display: flex;
        }

        .ai-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .ai-topbar-title {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-topbar-title span {
            color: var(--accent-green);
        }

        .btn-close-ai {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-close-ai:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-msg {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .chat-msg.user {
            align-self: flex-end;
            background-color: var(--accent-green);
            color: #1b0b30;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.ai {
            align-self: flex-start;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .ai-input-bar {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .ai-input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        #ai-textbox {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        #ai-textbox:focus {
            border-color: var(--accent-green);
        }

        @media (max-width: 600px) {
            .brand-title { font-size: 2.4rem; }
            .search-box { flex-direction: column; border-radius: 24px; padding: 14px; }
            .search-actions { width: 100%; justify-content: stretch; margin-top: 8px; }
            .search-actions .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- MAIN SEARCH ENGINE VIEW -->
    <div id="main-container">
        <div class="brand-header" onclick="resetHome()" style="cursor: pointer;" title="Back to Home">
            <!-- Custom SVG matching GrapeGreen logo -->
            <svg class="grape-svg" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="grapeGrad" cx="35%" cy="35%" r="65%">
                        <stop offset="0%" stop-color="#b794f4"/>
                        <stop offset="60%" stop-color="#7f52d1"/>
                        <stop offset="100%" stop-color="#4e2a8e"/>
                    </radialGradient>
                </defs>
                <!-- Green Leaf -->
                <path d="M58 2 C72 2, 82 14, 84 26 C70 24, 60 14, 58 2 Z" fill="#8ce03f"/>
                <!-- Row 1 (3 grapes) -->
                <circle cx="34" cy="36" r="15" fill="url(#grapeGrad)"/>
                <circle cx="60" cy="36" r="15" fill="url(#grapeGrad)"/>
                <circle cx="86" cy="36" r="15" fill="url(#grapeGrad)"/>
                <!-- Row 2 (3 grapes) -->
                <circle cx="46" cy="60" r="15" fill="url(#grapeGrad)"/>
                <circle cx="72" cy="60" r="15" fill="url(#grapeGrad)"/>
                <circle cx="96" cy="60" r="15" fill="url(#grapeGrad)"/>
                <!-- Row 3 (2 grapes) -->
                <circle cx="58" cy="84" r="15" fill="url(#grapeGrad)"/>
                <circle cx="84" cy="84" r="15" fill="url(#grapeGrad)"/>
                <!-- Row 4 (1 grape) -->
                <circle cx="71" cy="108" r="15" fill="url(#grapeGrad)"/>
            </svg>
            <h1 class="brand-title">Grape<span>Green</span> Search</h1>
            <p class="brand-tagline">Your dashboard, your tabs, your memes.</p>
        </div>

        <!-- Huge Search Bar & AI Mode Button -->
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search indexed sites, videos, images (fuzzy match enabled)..." autocomplete="off">
                <div class="search-actions">
                    <button class="btn btn-search" id="search-btn">Search</button>
                    <button class="btn btn-ai" id="open-ai-btn">✨ AI Mode</button>
                </div>
            </div>
        </div>

        <!-- Search Results Container -->
        <div id="results-area">
            <div id="fuzzy-banner"></div>

            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterSection('all', this)">All Results</button>
                <button class="tab-btn" onclick="filterSection('overview', this)">AI Overview</button>
                <button class="tab-btn" onclick="filterSection('sites', this)">Sites</button>
                <button class="tab-btn" onclick="filterSection('videos', this)">Videos</button>
                <button class="tab-btn" onclick="filterSection('images', this)">Images</button>
            </div>

            <!-- 1. AI Overview Section -->
            <div id="sec-overview" class="section-block ai-overview-card">
                <div class="section-heading">
                    <span>✨ AI Overview</span>
                    <span id="overview-match-badge" class="match-tag" style="display:none;"></span>
                </div>
                <div id="ai-overview-content" class="ai-overview-text"></div>
            </div>

            <!-- 2. Videos Section (Name of video + URL to video) -->
            <div id="sec-videos" class="section-block">
                <div class="section-heading"><span>🎬 Videos</span></div>
                <div id="videos-content" class="video-list"></div>
            </div>

            <!-- 3. Images Section (URL iframe to image) -->
            <div id="sec-images" class="section-block">
                <div class="section-heading"><span>🖼️ Images</span></div>
                <div id="images-content" class="image-iframe-grid"></div>
            </div>

            <!-- 4. Sites Section (reads from indexed/) -->
            <div id="sec-sites" class="section-block">
                <div class="section-heading"><span>🌐 Indexed Sites</span></div>
                <div id="sites-content" class="site-list"></div>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN AI MODE DIV -->
    <div id="ai-mode-screen">
        <div class="ai-topbar">
            <div class="ai-topbar-title">🍇 Grape<span>Green</span> AI Mode</div>
            <button class="btn-close-ai" id="close-ai-btn">✕ Back to Search</button>
        </div>

        <div id="chat-history">
            <div class="chat-msg ai">
                Welcome to <strong>GrapeGreen AI Mode</strong>! Ask me anything—your messages are sent directly to <code>ai/API.js</code>.
            </div>
        </div>

        <div class="ai-input-bar">
            <div class="ai-input-container">
                <input type="text" id="ai-textbox" placeholder="Ask GrapeGreen AI anything..." autocomplete="off">
                <button class="btn btn-search" id="ai-send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
