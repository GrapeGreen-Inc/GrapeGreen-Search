<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeGreen Search</title>
    <style>
        :root {
            --bg-primary: #3b1c63;
            --bg-secondary: #2a1249;
            --bg-surface: #4a247a;
            --accent-green: #8ce03f;
            --accent-green-hover: #76c72e;
            --accent-purple: #9d71e8;
            --text-primary: #ffffff;
            --text-secondary: #d4c5e8;
            --border-color: rgba(157, 113, 232, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .grape-svg {
            width: 82px;
            height: 98px;
            margin-bottom: 12px;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.3));
        }

        .brand-title {
            font-size: 3.3rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .brand-title span {
            color: var(--accent-green);
        }

        /* Main Layout */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }

        #main-container.has-results {
            justify-content: flex-start;
            padding-top: 28px;
        }

        #main-container.has-results .grape-svg {
            width: 40px;
            height: 48px;
            margin-bottom: 4px;
        }

        #main-container.has-results .brand-title {
            font-size: 1.9rem;
        }

        /* Search Bar */
        .search-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 28px 0 22px 0;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 14px 8px 26px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 12px 34px rgba(140, 224, 63, 0.18);
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            padding: 12px 10px;
            width: 100%;
        }

        #search-input::placeholder {
            color: rgba(212, 197, 232, 0.45);
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 30px;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-search {
            background-color: var(--accent-green);
            color: #1c0c31;
        }

        .btn-search:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-ai {
            background: linear-gradient(135deg, #6d3cc4, #4c2294);
            color: var(--text-primary);
            border: 1px solid var(--accent-purple);
        }

        .btn-ai:hover {
            background: linear-gradient(135deg, #7e49db, #5b29b0);
        }

        /* Results Area */
        #results-area {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 22px;
            padding-bottom: 60px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .section-block {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        .section-heading {
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 14px;
            font-weight: 700;
        }

        /* AI Overview */
        .ai-overview-card {
            background: linear-gradient(145deg, #2d144d, #3a1a63);
            border: 1px solid var(--accent-green);
        }

        .ai-overview-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* Videos */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .video-link-card:hover {
            border-color: var(--accent-green);
            background: #432070;
            transform: translateX(4px);
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .video-name {
            font-size: 1.08rem;
            font-weight: 700;
            color: #ffffff;
        }

        .video-url-text {
            font-size: 0.85rem;
            color: var(--accent-green);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-play-pill {
            background: var(--accent-green);
            color: #1c0c31;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Images (URL Iframes) */
        .image-iframe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .image-iframe-card {
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-iframe-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-green);
        }

        .image-iframe-frame {
            width: 100%;
            height: 200px;
            border: none;
            background: #1a0b2e;
            display: block;
        }

        .image-iframe-footer {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid var(--border-color);
        }

        .image-iframe-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .image-iframe-link {
            font-size: 0.78rem;
            color: var(--accent-green);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-iframe-link:hover {
            text-decoration: underline;
        }

        /* Sites */
        .site-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .site-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .site-item:hover {
            border-color: var(--accent-green);
            background: #432070;
            transform: translateX(4px);
        }

        .site-url {
            font-size: 0.85rem;
            color: var(--accent-green);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .site-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .empty-state {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Fullscreen AI Mode */
        #ai-mode-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-secondary);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }

        #ai-mode-screen.active {
            display: flex;
        }

        .ai-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .ai-topbar-title {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-topbar-title span {
            color: var(--accent-green);
        }

        .btn-close-ai {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-close-ai:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-msg {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .chat-msg.user {
            align-self: flex-end;
            background-color: var(--accent-green);
            color: #1b0b30;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.ai {
            align-self: flex-start;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .ai-input-bar {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .ai-input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        #ai-textbox {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        #ai-textbox:focus {
            border-color: var(--accent-green);
        }

        @media (max-width: 600px) {
            .brand-title { font-size: 2.4rem; }
            .search-box { flex-direction: column; border-radius: 24px; padding: 14px; }
            .search-actions { width: 100%; justify-content: stretch; margin-top: 8px; }
            .search-actions .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="brand-header" onclick="resetHome()">
            <svg class="grape-svg" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="grapeGrad" cx="35%" cy="35%" r="65%">

                <circle cx="34" cy="36" r="15" fill="url(#grapeGrad)"/>

        <div class="search-wrapper">

        <div id="results-area">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterSection('all', this)">All</button>
                <button class="tab-btn" onclick="filterSection('overview', this)">AI Overview</button>
                <button class="tab-btn" onclick="filterSection('sites', this)">Sites</button>
                <button class="tab-btn" onclick="filterSection('videos', this)">Videos</button>

            <div id="sec-overview" class="section-block ai-overview-card">

    <div id="ai-mode-screen">
        <div class="ai-topbar">

        <div id="chat-history"></div>

        <div class="ai-input-bar">
            <div class="ai-input-container">
                <input type="text" id="ai-textbox" placeholder="Ask anything..." autocomplete="off">
                <button class="btn btn-search" id="ai-send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const AI_OVERVIEWS = [
            {
                Q: "grapegreen",
                A: "GrapeGreen Search is a fast search engine with built-in AI Overviews, video links, image previews, and an interactive AI assistant."
            },
            {
                Q: "poop",
                A: "Poop (feces) is the solid or semisolid remains of food that was not digested in the small intestine, broken down by bacteria in the large intestine."
            },
            {
                Q: "wikipedia",
                A: "Wikipedia is a free online encyclopedia written and maintained by a community of volunteers through open collaboration."
            },
            {
                Q: "google",
                A: "Google is a multinational technology company specializing in internet search, cloud computing, online advertising, and software."
            },
            {
                Q: "youtube",
                A: "YouTube is an online video sharing and social media platform where users can upload, view, rate, share, and comment on videos."
            }
        ];

        function levenshteinDistance(a, b) {
            const m = a.length;
            const n = b.length;
            if (m === 0) return n;
            if (n === 0) return m;

            const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,
                        dp[i][j - 1] + 1,
                        dp[i - 1][j - 1] + cost
                    );
                }
            }
            return dp[m][n];
        }

        function computeFuzzyScore(query, targetText) {
            const q = String(query || '').toLowerCase().trim();
            const t = String(targetText || '').toLowerCase().trim();
            if (!q || !t) return 0;

            if (q === t) return 1.0;

            if (t.includes(q)) {
                return 0.88 + (0.1 * (q.length / t.length));
            }

            const queryWords = q.split(/\s+/);
            const targetWords = t.split(/[^a-z0-9]+/).filter(Boolean);
            let totalBestWordScore = 0;

            for (const qWord of queryWords) {
                let bestForThisWord = 0;

                const fullDist = levenshteinDistance(qWord, t);
                const fullSim = 1 - fullDist / Math.max(qWord.length, t.length);
                if (fullSim > bestForThisWord) bestForThisWord = fullSim;

                for (const tWord of targetWords) {
                    if (tWord.startsWith(qWord) || qWord.startsWith(tWord)) {
                        const prefixSim = 0.82 * (Math.min(qWord.length, tWord.length) / Math.max(qWord.length, tWord.length));
                        if (prefixSim > bestForThisWord) bestForThisWord = prefixSim;
                    }
                    const dist = levenshteinDistance(qWord, tWord);
                    const sim = 1 - dist / Math.max(qWord.length, tWord.length);
                    if (sim > bestForThisWord) bestForThisWord = sim;
                }

                totalBestWordScore += bestForThisWord;
            }

            return totalBestWordScore / queryWords.length;
        }

        const FUZZY_THRESHOLD = 0.52;

        async function fetchVideos(query) {
            let rawItems = [];

            for (const file of ['videos/videos.json', 'videos/manifest.json']) {
                try {
                    const res = await fetch(file);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data)) {
                            rawItems = data.map(entry => {
                                if (typeof entry === 'string') {
                                    const isUrl = /^https?:\/\//i.test(entry);
                                    return {
                                        name: entry.split('/').pop(),
                                        url: isUrl ? entry : `videos/${entry}`
                                    };
                                }
                                return {
                                    name: entry.name || entry.title || entry.url || 'Video',
                                    url: entry.url || '#'
                                };
                            });
                            break;
                        }
                    }
                } catch (e) {}
            }

            if (rawItems.length === 0) {
                try {
                    const dirRes = await fetch('videos/');
                    if (dirRes.ok) {
                        const html = await dirRes.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const exts = ['.mp4', '.webm', '.ogg', '.mov'];
                        Array.from(doc.querySelectorAll('a')).forEach(a => {
                            const href = decodeURIComponent(a.getAttribute('href') || '');
                            const fname = href.split('/').pop();
                            if (exts.some(ext => fname.toLowerCase().endsWith(ext))) {
                                rawItems.push({ name: fname, url: `videos/${fname}` });
                            }
                        });
                    }
                } catch (e) {}
            }

            return rawItems
                .map(vid => {
                    const score = Math.max(
                        computeFuzzyScore(query, vid.name),
                        computeFuzzyScore(query, vid.url) * 0.8
                    );
                    return { ...vid, score };
                })
                .filter(vid => vid.score >= FUZZY_THRESHOLD)
                .sort((a, b) => b.score - a.score);
        }

        async function fetchImages(query) {
            let rawItems = [];

            for (const file of ['images/images.json', 'images/manifest.json']) {
                try {
                    const res = await fetch(file);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data)) {
                            rawItems = data.map(entry => {
                                if (typeof entry === 'string') {
                                    const isUrl = /^https?:\/\//i.test(entry);
                                    return {
                                        name: entry.split('/').pop(),
                                        url: isUrl ? entry : `images/${entry}`
                                    };
                                }
                                return {
                                    name: entry.name || entry.title || entry.url || 'Image',
                                    url: entry.url || ''
                                };
                            });
                            break;
                        }
                    }
                } catch (e) {}
            }

            if (rawItems.length === 0) {
                try {
                    const dirRes = await fetch('images/');
                    if (dirRes.ok) {
                        const html = await dirRes.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const exts = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'];
                        Array.from(doc.querySelectorAll('a')).forEach(a => {
                            const href = decodeURIComponent(a.getAttribute('href') || '');
                            const fname = href.split('/').pop();
                            if (exts.some(ext => fname.toLowerCase().endsWith(ext))) {
                                rawItems.push({ name: fname, url: `images/${fname}` });
                            }
                        });
                    }
                } catch (e) {}
            }

            return rawItems
                .map(img => {
                    const score = Math.max(
                        computeFuzzyScore(query, img.name),
                        computeFuzzyScore(query, img.url) * 0.8
                    );
                    return { ...img, score };
                })
                .filter(img => img.score >= FUZZY_THRESHOLD && img.url)
                .sort((a, b) => b.score - a.score);
        }

        async function fetchIndexedSites(query) {
            const candidateFiles = new Set();
            const safeName = query.toLowerCase().trim().replace(/[^a-z0-9_-]/g, '_');
            if (safeName) candidateFiles.add(`indexed/${safeName}.json`);

            try {
                const manifestRes = await fetch('indexed/manifest.json');
                if (manifestRes.ok) {
                    const list = await manifestRes.json();
                    if (Array.isArray(list)) {
                        list.forEach(f => {
                            const clean = f.endsWith('.json') ? f : `${f}.json`;
                            candidateFiles.add(clean.startsWith('indexed/') ? clean : `indexed/${clean}`);
                        });
                    }
                }
            } catch (e) {}

            try {
                const dirRes = await fetch('indexed/');
                if (dirRes.ok) {
                    const html = await dirRes.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    Array.from(doc.querySelectorAll('a')).forEach(a => {
                        const href = decodeURIComponent(a.getAttribute('href') || '');
                        const fname = href.split('/').pop();
                        if (fname.toLowerCase().endsWith('.json') && fname.toLowerCase() !== 'manifest.json') {
                            candidateFiles.add(`indexed/${fname}`);
                        }
                    });
                }
            } catch (e) {}

            let allSites = [];

            for (const filePath of candidateFiles) {
                try {
                    const res = await fetch(filePath);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const entries = Array.isArray(data) ? data : [data];
                    const fileStem = filePath.split('/').pop().replace(/\.json$/i, '');

                    entries.forEach(site => {
                        allSites.push({ ...site, _sourceFile: fileStem });
                    });
                } catch (e) {}
            }

            const scoredSites = allSites.map(site => {
                const titleScore = computeFuzzyScore(query, site.title || '');
                const descScore = computeFuzzyScore(query, site.description || '') * 0.9;
                const fileScore = computeFuzzyScore(query, site._sourceFile || '');

                const kwList = Array.isArray(site.keywords) ? site.keywords : [site.keywords || ''];
                const kwScore = kwList.reduce((max, k) => Math.max(max, computeFuzzyScore(query, k)), 0);

                const metaList = Array.isArray(site["meta tags"]) ? site["meta tags"] : [site["meta tags"] || ''];
                const metaScore = metaList.reduce((max, m) => Math.max(max, computeFuzzyScore(query, m)), 0) * 0.95;

                const bestScore = Math.max(titleScore, descScore, fileScore, kwScore, metaScore);
                return { ...site, _score: bestScore };
            });

            return scoredSites
                .filter(s => s._score >= FUZZY_THRESHOLD)
                .sort((a, b) => {
                    if (Math.abs(b._score - a._score) > 0.12) {
                        return b._score - a._score;
                    }
                    return (Number(b.popular) || 0) - (Number(a.popular) || 0);
                });
        }

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const mainContainer = document.getElementById('main-container');
        const resultsArea = document.getElementById('results-area');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const isFullUrl = /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(query);
            const isDomain = /^[a-z0-9-]+(\.[a-z0-9-]+)+([\/?#].*)?$/i.test(query);

            if (isFullUrl) {
                window.location.href = query;
                return;
            }
            if (isDomain) {
                window.location.href = 'https://' + query;
                return;
            }

            mainContainer.classList.add('has-results');
            resultsArea.style.display = 'flex';

            // 1. AI Overview
            const overviewSection = document.getElementById('sec-overview');
            const overviewBox = document.getElementById('ai-overview-content');

            const scoredQA = AI_OVERVIEWS
                .map(item => ({ ...item, score: computeFuzzyScore(query, item.Q) }))
                .filter(item => item.score >= FUZZY_THRESHOLD)
                .sort((a, b) => b.score - a.score);

            const bestQA = scoredQA[0];

            if (bestQA) {
                overviewSection.style.display = 'block';
                overviewBox.textContent = bestQA.A;
            } else {
                overviewSection.style.display = 'none';
            }

            // 2. Sites
            const sitesContainer = document.getElementById('sites-content');
            sitesContainer.innerHTML = '<span class="empty-state">Searching...</span>';
            const sites = await fetchIndexedSites(query);

            if (sites.length > 0) {
                sitesContainer.innerHTML = sites.map(site => {
                    const targetUrl = site.url || '#';
                    return `
                        <div class="site-item" onclick="window.location.href='${escapeHTML(targetUrl)}'">
                            <div class="site-url">${escapeHTML(targetUrl)}</div>
                            <div class="site-title">${escapeHTML(site.title || 'Untitled')}</div>
                            <div class="site-desc">${escapeHTML(site.description || '')}</div>
                        </div>
                    `;
                }).join('');
            } else {
                sitesContainer.innerHTML = `<span class="empty-state">No results found for "${escapeHTML(query)}".</span>`;
            }

            // 3. Videos
            const videosContainer = document.getElementById('videos-content');
            videosContainer.innerHTML = '<span class="empty-state">Searching...</span>';
            const videos = await fetchVideos(query);

            if (videos.length > 0) {
                videosContainer.innerHTML = videos.map(vid => `
                    <a class="video-link-card" href="${escapeHTML(vid.url)}">
                        <div class="video-info">
                            <div class="video-name">▶ ${escapeHTML(vid.name)}</div>
                            <div class="video-url-text">${escapeHTML(vid.url)}</div>
                        </div>
                        <span class="video-play-pill">Watch</span>
                    </a>
                `).join('');
            } else {
                videosContainer.innerHTML = `<span class="empty-state">No videos found for "${escapeHTML(query)}".</span>`;
            }

            // 4. Images
            const imagesContainer = document.getElementById('images-content');
            imagesContainer.innerHTML = '<span class="empty-state">Searching...</span>';
            const images = await fetchImages(query);

            if (images.length > 0) {
                imagesContainer.innerHTML = images.map(img => `
                    <div class="image-iframe-card">
                        <iframe class="image-iframe-frame" src="${escapeHTML(img.url)}" title="${escapeHTML(img.name)}" loading="lazy"></iframe>
                        <div class="image-iframe-footer">
                            <div class="image-iframe-title">${escapeHTML(img.name)}</div>
                            <a class="image-iframe-link" href="${escapeHTML(img.url)}">${escapeHTML(img.url)}</a>
                        </div>
                    </div>
                `).join('');
            } else {
                imagesContainer.innerHTML = `<span class="empty-state">No images found for "${escapeHTML(query)}".</span>`;
            }
        }

        function filterSection(type, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const sections = {
                overview: document.getElementById('sec-overview'),
                sites: document.getElementById('sec-sites'),
                videos: document.getElementById('sec-videos'),
                images: document.getElementById('sec-images')
            };

            Object.entries(sections).forEach(([key, el]) => {
                if (type === 'all') {
                    if (key === 'overview') {
                        el.style.display = document.getElementById('ai-overview-content').textContent.trim() ? 'block' : 'none';
                    } else {
                        el.style.display = 'block';
                    }
                } else {
                    el.style.display = (type === key) ? 'block' : 'none';
                }
            });
        }

        function resetHome() {
            mainContainer.classList.remove('has-results');
            resultsArea.style.display = 'none';
            searchInput.value = '';
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        /* Fullscreen AI Mode */
        const aiModeScreen = document.getElementById('ai-mode-screen');
        const openAiBtn = document.getElementById('open-ai-btn');
        const closeAiBtn = document.getElementById('close-ai-btn');
        const aiTextbox = document.getElementById('ai-textbox');
        const aiSendBtn = document.getElementById('ai-send-btn');
        const chatHistory = document.getElementById('chat-history');

        let conversationHistory = [];

        openAiBtn.addEventListener('click', () => {
            aiModeScreen.classList.add('active');
            if (searchInput.value.trim() && !aiTextbox.value.trim()) {
                aiTextbox.value = searchInput.value.trim();
            }
            aiTextbox.focus();
        });

        closeAiBtn.addEventListener('click', () => {
            aiModeScreen.classList.remove('active');
        });

        function appendChatMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${role}`;
            msgDiv.textContent = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return msgDiv;
        }

        async function sendToAI() {
            const userText = aiTextbox.value.trim();
            if (!userText) return;

            aiTextbox.value = '';
            appendChatMessage('user', userText);
            conversationHistory.push({ role: 'user', content: userText });

            const loadingBubble = appendChatMessage('ai', '...');

            try {
                const response = await fetch('ai/API.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: userText,
                        history: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const contentType = response.headers.get('content-type') || '';
                let replyText = '';

                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    replyText = data.reply || data.response || data.answer || JSON.stringify(data);
                } else {
                    replyText = await response.text();
                }

                loadingBubble.textContent = replyText;
                conversationHistory.push({ role: 'assistant', content: replyText });

            } catch (err) {
                try {
                    const apiModule = await import('./ai/API.js');
                    if (typeof apiModule.askAI === 'function') {
                        const modReply = await apiModule.askAI(userText, conversationHistory);
                        loadingBubble.textContent = modReply;
                        conversationHistory.push({ role: 'assistant', content: modReply });
                        return;
                    }
                } catch (moduleErr) {
                    loadingBubble.textContent = 'Unable to connect right now.';
                }
            }
        }

        aiSendBtn.addEventListener('click', sendToAI);
        aiTextbox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendToAI();
        });

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/`/g, '&#96;');
        }
    </script>
</body>
</html>
